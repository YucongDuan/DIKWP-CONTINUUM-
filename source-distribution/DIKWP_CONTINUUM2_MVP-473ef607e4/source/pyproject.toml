[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikwp-continuum2"
version = "1.0.0"
description = "Cross-substrate life continuity, identity fidelity and open-ended longevity research prototype"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "DIKWP research prototype"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
